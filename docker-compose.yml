version: '3.8'

services:
  # PostGIS Database
  postgis:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: wildfire
      POSTGRES_USER: wildfire
      POSTGRES_PASSWORD: wildfire_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildfire"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python ML Inference Service
  ml-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONPATH=/app
    command: uvicorn ml.inference.server:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ML_SERVICE_URL=http://ml-service:8001
      - NASA_FIRMS_API_KEY=${NASA_FIRMS_API_KEY:-}
      - NODE_ENV=production
    depends_on:
      ml-service:
        condition: service_healthy

  # React Frontend (dev mode — use nginx for production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - backend

volumes:
  pgdata:
